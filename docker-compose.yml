# Task Hive — stack completa em casa (Postgres + API + Next + Nginx).
# Acesso na LAN por IP: http://IP:8080 (sem DNS).
#
# Pré-requisito: backend/.env (ver backend/.env.example).
# Não corras em paralelo com backend/docker-compose.yml (mesmos nomes de contentor).

services:
  postgres:
    image: postgres:16-alpine
    container_name: task-hive-postgres
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - task_hive_pg:/var/lib/postgresql/data
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '${POSTGRES_PUBLISH_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taskhive

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-hive-api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      APP_PORT: '3001'
      DB_HOST: postgres
      DB_PORT: '5432'
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3001'
    networks:
      taskhive:
        aliases:
          - api

  web:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: task-hive-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      # BFF → API na rede Docker (alias `api` + container_name).
      BACKEND_API_BASE_URL: http://api:3001
      # HTTP na LAN: cookie sem Secure; HSTS desligado até haver TLS.
      SESSION_COOKIE_SECURE: 'false'
      ENABLE_HSTS: 'false'
      # Opcional: força a URL pública do Socket.IO (senão deriva do Host).
      # PUBLIC_WS_URL: http://192.168.1.50:8080
    depends_on:
      - api
    expose:
      - '3000'
    networks:
      - taskhive

  nginx:
    image: nginx:alpine
    container_name: task-hive-nginx
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - taskhive

networks:
  taskhive:
    name: taskhive

volumes:
  task_hive_pg:
    name: task_hive_pg
