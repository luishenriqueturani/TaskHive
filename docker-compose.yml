# Hardening partilhado — contentores Node/Nginx sem privilégios extra.
x-node-security: &node-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-node-limits: &node-limits
  mem_limit: 768m
  cpus: "1.0"

# Task Hive — stack completa em casa (Postgres + API + Next + Nginx).
# Acesso na LAN por IP: http://IP:${HTTP_PORT:-8080} (sem DNS).
#
# Pré-requisito: backend/.env + atalho na raiz para o Compose interpolar portas:
#   ./scripts/link-compose-env.sh
#   (cria `.env` → `backend/.env`; sem isto POSTGRES_PUBLISH_PORT/HTTP_PORT/GRAFANA_PORT
#    caem nos defaults e podem colidir com outro projeto na 5432/8080.)
# Não corras em paralelo com backend/docker-compose.yml (mesmos nomes de contentor).

services:
  postgres:
    image: postgres:16-alpine
    container_name: task-hive-postgres
    restart: unless-stopped
    env_file: ./backend/.env
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "1.5"
    volumes:
      - task_hive_pg:/var/lib/postgresql/data
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PUBLISH_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taskhive

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-hive-api
    restart: unless-stopped
    env_file: ./backend/.env
    <<: [*node-security, *node-limits]
    environment:
      NODE_ENV: production
      APP_PORT: '3001'
      DB_HOST: postgres
      DB_PORT: '5432'
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3001'
    networks:
      taskhive:
        aliases:
          - api

  web:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: task-hive-web
    restart: unless-stopped
    <<: [*node-security, *node-limits]
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      BACKEND_API_BASE_URL: http://api:3001
      SESSION_COOKIE_SECURE: 'false'
      ENABLE_HSTS: 'false'
      # CSRF — origens do browser permitidas (login/registo). Ajustar ao IP:porta da LAN.
      CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:3000}
      # URL pública do Socket.IO (browser). Definir no .env da raiz, ex.: http://192.168.1.18:8080
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-http://127.0.0.1:8080}
    depends_on:
      - api
    expose:
      - '3000'
    networks:
      - taskhive

  nginx:
    image: nginx:alpine
    container_name: task-hive-nginx
    restart: unless-stopped
    <<: [*node-security, *node-limits]
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - taskhive

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: task-hive-prometheus
    restart: unless-stopped
    <<: [*node-security, *node-limits]
    env_file: ./backend/.env
    entrypoint: [/docker/prometheus/entrypoint.sh]
    volumes:
      - ./docker/prometheus/entrypoint.sh:/docker/prometheus/entrypoint.sh:ro
      - ./docker/prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - task_hive_prometheus:/prometheus
    expose:
      - '9090'
    depends_on:
      - api
    networks:
      - taskhive

  grafana:
    image: grafana/grafana:11.3.0
    container_name: task-hive-grafana
    restart: unless-stopped
    <<: [*node-security, *node-limits]
    env_file: ./backend/.env
    ports:
      # Default 0.0.0.0 — UI só leitura na LAN; use GRAFANA_BIND=127.0.0.1 + túnel SSH se preferires.
      - '${GRAFANA_BIND:-0.0.0.0}:${GRAFANA_PORT:-3002}:3000'
    environment:
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Adapta-se ao host:porta usados no browser (IP ou orangepi.local).
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s:%(http_port)s/'
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export GF_SECURITY_ADMIN_USER="$${GRAFANA_ADMIN_USER:-admin}"
        export GF_SECURITY_ADMIN_PASSWORD="$${GRAFANA_ADMIN_PASSWORD:-}"
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "Defina GRAFANA_ADMIN_PASSWORD no backend/.env" >&2
          exit 1
        fi
        exec /run.sh
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - task_hive_grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - taskhive

networks:
  taskhive:
    name: taskhive

volumes:
  task_hive_pg:
    name: task_hive_pg
  task_hive_prometheus:
    name: task_hive_prometheus
  task_hive_grafana:
    name: task_hive_grafana
