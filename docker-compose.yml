# Hardening partilhado — contentores Node sem privilégios extra.
x-node-security: &node-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-node-limits: &node-limits
  mem_limit: 768m
  cpus: "1.0"

# Task Hive — só a aplicação (API + Next).
# No Orange Pi, Postgres, Nginx, Prometheus e Grafana estão em /root/infra
# (redes externas shared-db e shared-proxy). Sem essas redes o compose não sobe.
#
# A API liga a shared-postgres:5432. O acesso remoto ao Postgres é a porta 5433 no host.
# O Nginx partilhado publica a UI em :8080 e o Grafana em :3002.
#
# Pré-requisito: backend/.env + atalho na raiz para PUBLIC_* / CSRF_*:
#   ./scripts/link-compose-env.sh

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-hive-api
    restart: unless-stopped
    env_file: ./backend/.env
    <<: [*node-security, *node-limits]
    environment:
      NODE_ENV: production
      APP_PORT: '3001'
      DB_HOST: shared-postgres
      DB_PORT: '5432'
    expose:
      - '3001'
    networks:
      shared-db: {}
      shared-proxy:
        aliases:
          - api

  web:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: task-hive-web
    restart: unless-stopped
    <<: [*node-security, *node-limits]
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      BACKEND_API_BASE_URL: http://task-hive-api:3001
      SESSION_COOKIE_SECURE: 'false'
      ENABLE_HSTS: 'false'
      # CSRF — origens do browser permitidas (login/registo). Ajustar ao IP:porta da LAN.
      CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:3000}
      # URL pública do Socket.IO (browser). Definir no .env da raiz, ex.: http://192.168.1.34:8080
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-http://127.0.0.1:8080}
      # URL pública da UI (redirects de sessão). Ex.: http://192.168.1.34:8080 ou http://orangepi.local:8080
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
    expose:
      - '3000'
    networks:
      shared-proxy:
        aliases:
          - web

networks:
  shared-db:
    external: true
    name: shared-db
  shared-proxy:
    external: true
    name: shared-proxy
