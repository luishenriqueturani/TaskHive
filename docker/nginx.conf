# Vhost do TaskHive no Nginx partilhado (/root/infra/nginx).
# A zona auth_limit está em conf.d/00-limits.conf desse Nginx.
# Copiar este ficheiro para conf.d/taskhive.conf e recarregar o Nginx.
#
# O resolver do Docker evita 502 depois de um rebuild: o IP é resolvido
# em cada pedido, não só no arranque.
#
# Não encaminhar /projects, /to-do, /users, etc. para a API.
# Essas paths são rotas de página do Next; o BFF fala com a API na rede Docker.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Redirects relativos: o browser mantém host:porta (:8080). Absolutos com
    # $host (sem porta) mandavam para a :80 (CasaOS) e o 301 ficava em cache.
    absolute_redirect off;
    port_in_redirect on;

    location /socket.io/ {
        set $upstream task-hive-api:3001;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400;
    }

    location = /swagger/ {
        return 302 /swagger;
    }

    location = /swagger {
        set $upstream task-hive-api:3001;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect http://$host/ $scheme://$http_host/;
        proxy_redirect http://$host:80/ $scheme://$http_host/;
    }

    location /swagger/ {
        set $upstream task-hive-api:3001;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect http://$host/ $scheme://$http_host/;
        proxy_redirect http://$host:80/ $scheme://$http_host/;
    }

    location = /api-json {
        set $upstream task-hive-api:3001;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        set $upstream task-hive-web:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location / {
        set $upstream task-hive-web:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
