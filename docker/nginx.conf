# Entrada única na LAN (HTTP). Aceita acesso por IP — sem DNS.
# Browser → Nginx:8080 → Next (UI + BFF) ou Nest (Socket.IO / Swagger).
#
# Importante: NÃO encaminhar /projects, /to-do, /users, etc. para a API.
# Essas paths são rotas de página do Next; o BFF fala com a API na rede Docker
# via /api/bff → http://api:3001.

upstream taskhive_api {
    server api:3001;
}

upstream taskhive_web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Socket.IO (timetrack) — o cliente liga ao mesmo host:porta da UI.
    location /socket.io/ {
        proxy_pass http://taskhive_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400;
    }

    # Swagger Nest em /swagger/ (Next usa /api/* para o BFF).
    location = /swagger {
        return 301 /swagger/;
    }

    location /swagger/ {
        proxy_pass http://taskhive_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api-json {
        proxy_pass http://taskhive_api/api-json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Next.js (páginas + /api/bff + /api/auth + /api/runtime)
    location / {
        proxy_pass http://taskhive_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
