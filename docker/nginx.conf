# Entrada única na LAN (HTTP). Aceita acesso por IP — sem DNS.
# Browser → Nginx:8080 → Next (UI + BFF) ou Nest (Socket.IO / Swagger).
#
# Importante: NÃO encaminhar /projects, /to-do, /users, etc. para a API.
# Essas paths são rotas de página do Next; o BFF fala com a API na rede Docker
# via /api/bff → http://api:3001.

upstream taskhive_api {
    server api:3001;
}

upstream taskhive_web {
    server web:3000;
}

# Deve ficar no contexto http (fora de `server`) — conf.d é incluído em http { }.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Redirects relativos: o browser mantém host:porta (:8080). Absolutos com
    # $host (sem porta) mandavam para a :80 (CasaOS) e o 301 ficava em cache.
    absolute_redirect off;
    port_in_redirect on;

    # Socket.IO (timetrack) — o cliente liga ao mesmo host:porta da UI.
    location /socket.io/ {
        proxy_pass http://taskhive_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 86400;
    }

    # Swagger Nest no mesmo path público `/swagger` (Next usa `/api/*` para o BFF).
    # Página sem trailing slash: o UI gera assets `./swagger/...` que só resolvem
    # certo a partir de `/swagger` (não `/swagger/`).
    # 302 (não 301): evita cache permanente de Location errado sem :8080.
    location = /swagger/ {
        return 302 /swagger;
    }

    location = /swagger {
        proxy_pass http://taskhive_api/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Se o Nest emitir Location absoluto sem porta, reescreve com a do cliente.
        proxy_redirect http://$host/ $scheme://$http_host/;
        proxy_redirect http://$host:80/ $scheme://$http_host/;
    }

    location /swagger/ {
        proxy_pass http://taskhive_api/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect http://$host/ $scheme://$http_host/;
        proxy_redirect http://$host:80/ $scheme://$http_host/;
    }

    location = /api-json {
        proxy_pass http://taskhive_api/api-json;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # BFF auth (login, logout, refresh, reset) — rate limit na borda
    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://taskhive_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Next.js (páginas + /api/bff + /api/runtime)
    location / {
        proxy_pass http://taskhive_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
